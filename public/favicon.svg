<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0C1116"/>
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <!-- 3 converging incoming rays from left -->
    <line x1="6" y1="20" x2="26" y2="32" stroke-width="3" opacity="0.8"/>
    <line x1="4" y1="32" x2="26" y2="32" stroke-width="3.5"/>
    <line x1="6" y1="44" x2="26" y2="32" stroke-width="3" opacity="0.8"/>

    <!-- Prism A structure -->
    <line x1="20" y1="50" x2="32" y2="14" stroke-width="4.5"/>
    <line x1="32" y1="14" x2="44" y2="50" stroke-width="4.5"/>

    <!-- Emerging single truth beam to right -->
    <line x1="26" y1="32" x2="60" y2="32" stroke-width="4.5"/>
  </g>
  <!-- Focal dot -->
  <circle cx="26" cy="32" r="4.5" fill="#FFFFFF"/>
</svg>
