<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#0C1116"/>
  <!-- Converging light rays -->
  <line x1="8" y1="20" x2="28" y2="28" stroke="#863BFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="6" y1="28" x2="28" y2="28" stroke="#863BFF" stroke-width="3" stroke-linecap="round"/>
  <line x1="8" y1="36" x2="28" y2="28" stroke="#863BFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Prism A structure -->
  <line x1="22" y1="44" x2="34" y2="16" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="34" y1="16" x2="46" y2="44" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Emitted truth beam -->
