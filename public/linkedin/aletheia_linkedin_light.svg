<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="800" fill="#FFFFFF" rx="0"/>
  
  <g transform="translate(100, 160) scale(1.2)">
    <style>
      line { stroke: #0D1117; stroke-width: 3; stroke-linecap: round; fill: none; }
      circle { fill: #7E14FF; }
      text { fill: #0D1117; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .beam { stroke: #7E14FF; stroke-width: 4; }
      .ray { stroke: rgba(13, 17, 23, 0.4); }
    </style>

    <!-- Converging Rays -->
    <line class="ray" x1="110" y1="85"  x2="316" y2="110"/>
    <line class="ray" x1="100" y1="110" x2="316" y2="110"/>
    <line class="ray" x1="110" y1="135" x2="316" y2="110"/>

    <!-- Prism A structure -->
    <line x1="296" y1="160" x2="340" y2="50"/>
    <line x1="340" y1="50"  x2="384" y2="160"/>

    <!-- Truth Beam -->
    <line class="beam" x1="316" y1="110" x2="550" y2="110"/>

    <!-- Prism focal point -->
    <circle cx="316" cy="110" r="6"/>

    <!-- Wordmark -->
    <text x="340" y="235" text-anchor="middle" font-size="30" font-weight="600" letter-spacing="8">ALETHEIA</text>
  </g>
</svg>
